    <div id="root"></div>
    
    <!-- 즉시 적용되는 CSS로 초기 플래시 방지 -->
    <style>
      /* 페이지 로드 시 즉시 적용되는 배경색 */
      html, body {
        background: linear-gradient(to bottom, #111827, #1f2937);
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      
      /* 앱 로딩 중 표시할 기본 스타일 */
      #root {
        background: linear-gradient(to bottom, #111827, #1f2937);
        min-height: 100vh;
        color: #e5e7eb;
      }
      
      /* 폰트 로딩 중 fallback 폰트 설정 */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif;
      }
      
      /* 초기 로딩 표시기 (React 앱이 로드되기 전까지) */
      .initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #111827, #1f2937);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .initial-loading::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid #374151;
        border-top: 3px solid #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* React 앱이 로드되면 초기 로딩 숨김 */
      #root:not(:empty) ~ .initial-loading {
        display: none;
      }
    </style>
    
    <!-- 초기 로딩 표시기 -->
    <div class="initial-loading"></div>
  </body>
