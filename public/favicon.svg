<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#faviconGradient)" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Korean initial "ㅎ" stylized -->
  <g fill="white" stroke="none">
    <!-- Top horizontal line -->
    <rect x="8" y="10" width="16" height="2" rx="1"/>
    
    <!-- Left vertical line -->
    <rect x="10" y="8" width="2" height="8" rx="1"/>
    
    <!-- Right vertical line -->
    <rect x="20" y="8" width="2" height="8" rx="1"/>
    
    <!-- Bottom horizontal connector -->
    <rect x="10" y="16" width="12" height="2" rx="1"/>
    
    <!-- Bottom vertical line (center) -->
    <rect x="15" y="18" width="2" height="6" rx="1"/>
  </g>
  
  <!-- Small music note accent -->
  <g fill="white" opacity="0.6" transform="translate(22, 22) scale(0.4)">
    <circle cx="0" cy="0" r="2"/>
    <rect x="2" y="-6" width="1" height="6"/>
  </g>
</svg>