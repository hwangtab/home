<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="visualGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#visualGradient)"/>
  
  <!-- Camera Icon -->
  <g transform="translate(200, 200)">
    <!-- Camera body -->
    <rect x="-70" y="-30" width="140" height="60" rx="8" fill="white" opacity="0.9"/>
    <rect x="-65" y="-25" width="130" height="50" rx="6" fill="url(#visualGradient)" opacity="0.3"/>
    
    <!-- Camera top -->
    <rect x="-50" y="-45" width="100" height="20" rx="4" fill="white" opacity="0.8"/>
    
    <!-- Lens -->
    <circle cx="0" cy="0" r="25" fill="white" opacity="0.9"/>
    <circle cx="0" cy="0" r="20" fill="url(#visualGradient)" opacity="0.4"/>
    <circle cx="0" cy="0" r="15" fill="white" opacity="0.6"/>
    <circle cx="0" cy="0" r="8" fill="url(#visualGradient)" opacity="0.8"/>
    
    <!-- Viewfinder -->
    <rect x="-35" y="-40" width="15" height="10" rx="2" fill="white" opacity="0.7"/>
    
    <!-- Flash -->
    <rect x="25" y="-40" width="12" height="8" rx="2" fill="white" opacity="0.8"/>
    
    <!-- Shutter button -->
    <circle cx="15" cy="-35" r="4" fill="white" opacity="0.9"/>
    
    <!-- Camera strap attachment -->
    <rect x="-75" y="-15" width="8" height="15" rx="4" fill="white" opacity="0.6"/>
    <rect x="67" y="-15" width="8" height="15" rx="4" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Label -->
  <text x="200" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold" opacity="0.8">
    VISUAL
  </text>
</svg>