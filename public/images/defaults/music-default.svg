<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="musicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#musicGradient)"/>
  
  <!-- Music Note Icon -->
  <g transform="translate(200, 200)">
    <!-- Eighth note -->
    <circle cx="-40" cy="40" r="20" fill="white" opacity="0.9"/>
    <rect x="-23" y="-60" width="6" height="100" fill="white" opacity="0.9"/>
    <path d="M -17 -60 Q 20 -50 20 -20 L 20 20 Q 20 30 10 35 Q 0 40 -10 35 Q -20 30 -20 20 L -20 -45 Z" fill="white" opacity="0.6"/>
    
    <!-- Sixteenth note -->
    <circle cx="40" cy="50" r="18" fill="white" opacity="0.9"/>
    <rect x="55" y="-50" width="5" height="100" fill="white" opacity="0.9"/>
    <path d="M 60 -50 Q 90 -40 90 -15 L 90 25 Q 90 35 82 38 Q 74 42 66 38 Q 58 35 58 25 L 58 -35 Z" fill="white" opacity="0.6"/>
    
    <!-- Connecting beam -->
    <path d="M -17 -60 L 60 -50 L 60 -40 L -17 -50 Z" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Label -->
  <text x="200" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold" opacity="0.8">
    MUSIC
  </text>
</svg>