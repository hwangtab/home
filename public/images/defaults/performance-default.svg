<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="performanceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#performanceGradient)"/>
  
  <!-- Microphone Icon -->
  <g transform="translate(200, 200)">
    <!-- Mic capsule -->
    <ellipse cx="0" cy="-30" rx="25" ry="35" fill="white" opacity="0.9"/>
    <ellipse cx="0" cy="-30" rx="20" ry="30" fill="url(#performanceGradient)" opacity="0.3"/>
    
    <!-- Mic grille lines -->
    <rect x="-15" y="-55" width="30" height="2" fill="white" opacity="0.4"/>
    <rect x="-15" y="-45" width="30" height="2" fill="white" opacity="0.4"/>
    <rect x="-15" y="-35" width="30" height="2" fill="white" opacity="0.4"/>
    <rect x="-15" y="-25" width="30" height="2" fill="white" opacity="0.4"/>
    <rect x="-15" y="-15" width="30" height="2" fill="white" opacity="0.4"/>
    <rect x="-15" y="-5" width="30" height="2" fill="white" opacity="0.4"/>
    
    <!-- Mic handle -->
    <rect x="-8" y="5" width="16" height="60" rx="8" fill="white" opacity="0.9"/>
    <rect x="-6" y="10" width="12" height="50" rx="6" fill="url(#performanceGradient)" opacity="0.2"/>
    
    <!-- Mic stand connector -->
    <rect x="-12" y="65" width="24" height="15" rx="4" fill="white" opacity="0.8"/>
    
    <!-- Stand -->
    <rect x="-2" y="80" width="4" height="40" fill="white" opacity="0.7"/>
    
    <!-- Stand base -->
    <ellipse cx="0" cy="120" rx="30" ry="8" fill="white" opacity="0.7"/>
    
    <!-- Sound waves -->
    <g opacity="0.5">
      <path d="M 40 -30 Q 50 -40 50 -30 Q 50 -20 40 -30" stroke="white" stroke-width="3" fill="none"/>
      <path d="M 45 -30 Q 60 -45 60 -30 Q 60 -15 45 -30" stroke="white" stroke-width="2" fill="none"/>
      
      <path d="M -40 -30 Q -50 -40 -50 -30 Q -50 -20 -40 -30" stroke="white" stroke-width="3" fill="none"/>
      <path d="M -45 -30 Q -60 -45 -60 -30 Q -60 -15 -45 -30" stroke="white" stroke-width="2" fill="none"/>
    </g>
  </g>
  
  <!-- Label -->
  <text x="200" y="350" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold" opacity="0.8">
    PERFORMANCE
  </text>
</svg>