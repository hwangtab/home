<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="40" fill="white" opacity="0.05"/>
  <circle cx="1100" cy="530" r="60" fill="white" opacity="0.03"/>
  <rect x="50" y="500" width="80" height="80" rx="10" fill="white" opacity="0.04"/>
  
  <!-- Main text -->
  <text x="600" y="280" text-anchor="middle" fill="url(#textGradient)" font-family="serif" font-size="72" font-weight="bold">
    황경하
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="350" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="36" font-weight="300">
    Official Web
  </text>
  
  <!-- Description -->
  <text x="600" y="420" text-anchor="middle" fill="#6b7280" font-family="sans-serif" font-size="24">
    음악가 · 사운드 엔지니어 · 프로듀서
  </text>
  
  <!-- Keywords -->
  <text x="600" y="480" text-anchor="middle" fill="#4b5563" font-family="sans-serif" font-size="18">
    연대 · 민중음악 · 사회적 메시지
  </text>
  
  <!-- Music note decoration -->
  <g transform="translate(200, 200)" opacity="0.1">
    <circle cx="0" cy="0" r="8" fill="white"/>
    <rect x="8" y="-40" width="3" height="40" fill="white"/>
    <path d="M8 -40 Q20 -45 20 -35 Q20 -25 8 -30" fill="white"/>
  </g>
  
  <g transform="translate(1000, 400)" opacity="0.08">
    <circle cx="0" cy="0" r="6" fill="white"/>
    <rect x="6" y="-30" width="2" height="30" fill="white"/>
    <path d="M6 -30 Q15 -35 15 -25 Q15 -20 6 -22" fill="white"/>
  </g>
</svg>