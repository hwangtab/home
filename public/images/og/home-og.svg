<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="homeBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="homeTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="spotlightGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#homeBgGradient)"/>
  
  <!-- Spotlight effect -->
  <ellipse cx="600" cy="250" rx="400" ry="200" fill="url(#spotlightGradient)"/>
  
  <!-- Decorative music elements -->
  <g opacity="0.06">
    <!-- Vinyl record -->
    <circle cx="150" cy="150" r="50" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="150" cy="150" r="30" fill="none" stroke="white" stroke-width="1"/>
    <circle cx="150" cy="150" r="10" fill="none" stroke="white" stroke-width="1"/>
    <circle cx="150" cy="150" r="3" fill="white"/>
    
    <!-- Speaker -->
    <rect x="1050" y="450" width="100" height="120" rx="10" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="1100" cy="480" r="15" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="1100" cy="530" r="20" fill="none" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="240" text-anchor="middle" fill="url(#homeTextGradient)" font-family="serif" font-size="84" font-weight="bold">
    황경하
  </text>
  
  <!-- Subtitle with emphasis -->
  <text x="600" y="320" text-anchor="middle" fill="#d1d5db" font-family="sans-serif" font-size="42" font-weight="400">
    Official Web
  </text>
  
  <!-- Description -->
  <text x="600" y="390" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="28">
    현장에서 예술이 힘을 갖는 순간을 주목하는
  </text>
  
  <!-- Role -->
  <text x="600" y="440" text-anchor="middle" fill="#6b7280" font-family="sans-serif" font-size="24">
    음악가 · 사운드 엔지니어 · 프로듀서
  </text>
  
  <!-- Keywords with separator -->
  <text x="600" y="510" text-anchor="middle" fill="#4b5563" font-family="sans-serif" font-size="20" opacity="0.8">
    연대 • 민중음악 • 젠트리피케이션 • 사회적 저항
  </text>
  
  <!-- Decorative line -->
  <line x1="400" y1="360" x2="800" y2="360" stroke="#4b5563" stroke-width="1" opacity="0.5"/>
</svg>