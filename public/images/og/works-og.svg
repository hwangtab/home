<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="worksBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="worksTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#worksBgGradient)"/>
  
  <!-- Album cover mockups -->
  <g opacity="0.1">
    <rect x="100" y="100" width="120" height="120" rx="8" fill="white"/>
    <rect x="250" y="150" width="100" height="100" rx="6" fill="white"/>
    <rect x="950" y="120" width="130" height="130" rx="8" fill="white"/>
    <rect x="1000" y="400" width="110" height="110" rx="6" fill="white"/>
  </g>
  
  <!-- Music note pattern -->
  <g opacity="0.08">
    <g transform="translate(80, 350)">
      <circle cx="0" cy="0" r="8" fill="white"/>
      <rect x="8" y="-40" width="3" height="40" fill="white"/>
      <path d="M8 -40 Q20 -45 20 -35 Q20 -25 8 -30" fill="white"/>
    </g>
    <g transform="translate(150, 380)">
      <circle cx="0" cy="0" r="6" fill="white"/>
      <rect x="6" y="-30" width="2" height="30" fill="white"/>
    </g>
    <g transform="translate(1050, 350)">
      <circle cx="0" cy="0" r="8" fill="white"/>
      <rect x="8" y="-40" width="3" height="40" fill="white"/>
      <path d="M8 -40 Q20 -45 20 -35 Q20 -25 8 -30" fill="white"/>
    </g>
  </g>
  
  <!-- Main title -->
  <text x="600" y="200" text-anchor="middle" fill="url(#worksTextGradient)" font-family="serif" font-size="84" font-weight="bold">
    작품
  </text>
  
  <!-- Artist name -->
  <text x="600" y="280" text-anchor="middle" fill="#e2e8f0" font-family="serif" font-size="48" font-weight="400">
    황경하
  </text>
  
  <!-- Description -->
  <text x="600" y="360" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="32">
    사회적 메시지를 담은 음악과 글
  </text>
  
  <!-- Featured works -->
  <text x="600" y="420" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">
    젠트리피케이션 · 민중음악 선곡집 · 몸의 중심
  </text>
  
  <!-- Categories -->
  <text x="600" y="480" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="20">
    음악 • 글 • 사진 • 공연
  </text>
  
  <!-- Decorative elements -->
  <rect x="200" y="330" width="60" height="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="940" y="330" width="60" height="2" fill="#3b82f6" opacity="0.6"/>
</svg>